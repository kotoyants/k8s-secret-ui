name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run; tag (release) runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    if: github.ref_type != 'tag' # the tagged commit was already checked on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # DB tests start Postgres via testcontainers (Docker is available on the runner).
      - run: go test -race ./...

  lint:
    if: github.ref_type != 'tag' # the tagged commit was already checked on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  sqlc:
    if: github.ref_type != 'tag' # the tagged commit was already checked on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generated DB code is up to date
        run: make sqlc-check

  helm:
    if: github.ref_type != 'tag' # the tagged commit was already checked on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/k8s-secret-ui -f deploy/helm/values-prod.example.yaml
      - name: Validate rendered manifests
        run: |
          helm template k8s-secret-ui deploy/helm/k8s-secret-ui -n admin \
            -f deploy/helm/values-prod.example.yaml --set ingress.enabled=true --set ingress.host=example.com \
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -

  image:
    needs: [test, lint, sqlc, helm]
    # Checks are skipped on tag runs, so require "not failed" rather than "all succeeded".
    if: github.event_name == 'push' && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Own cache key: the test job's cache holds -race builds, which don't match this one.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-release-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/secret-manager ./cmd/secret-manager
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package and push chart to oci://ghcr.io/${{ github.repository_owner }}/charts
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/k8s-secret-ui --version "$version" --app-version "$version" -d dist
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/k8s-secret-ui-${version}.tgz" "oci://ghcr.io/${OWNER,,}/charts"
