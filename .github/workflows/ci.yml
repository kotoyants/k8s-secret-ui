name: ci

# Releases come from main, not from pushed tags: when a push to main changes the version in
# Chart.yaml (no vX.Y.Z tag yet), the same run builds the X.Y.Z image, publishes the chart and
# creates the git tag. Tags created with GITHUB_TOKEN do not start another run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR runs are cancelled by newer pushes. Main runs queue instead, so a release is never cut short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # DB tests start Postgres via testcontainers (Docker is available on the runner).
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generated DB code is up to date
        run: make sqlc-check

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/k8s-secret-ui -f deploy/helm/values-prod.example.yaml
      - name: Validate rendered manifests
        run: |
          helm template k8s-secret-ui deploy/helm/k8s-secret-ui -n admin \
            -f deploy/helm/values-prod.example.yaml --set ingress.enabled=true --set ingress.host=example.com \
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -

  # Is this push a release? Yes when Chart.yaml has a version whose vX.Y.Z tag doesn't exist yet.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          chart=deploy/helm/k8s-secret-ui/Chart.yaml
          version=$(sed -n 's/^version: *//p' "$chart" | tr -d '"')
          app=$(sed -n 's/^appVersion: *//p' "$chart" | tr -d '"')
          if [ "$version" != "$app" ]; then
            echo "::error file=$chart::version ($version) and appVersion ($app) differ"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            release=false
          else
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $version, release: $release" >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: [test, lint, sqlc, helm, release]
    # Releases always build; otherwise only feat/fix commits (Conventional Commits,
    # e.g. "feat: …", "fix(ui): …", "feat!: …"), judged by the last commit of the push.
    if: >-
      github.event_name == 'push' && (
        needs.release.outputs.release == 'true' ||
        startsWith(github.event.head_commit.message, 'feat:') ||
        startsWith(github.event.head_commit.message, 'feat(') ||
        startsWith(github.event.head_commit.message, 'feat!:') ||
        startsWith(github.event.head_commit.message, 'fix:') ||
        startsWith(github.event.head_commit.message, 'fix(') ||
        startsWith(github.event.head_commit.message, 'fix!:')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Own cache key: the test job's cache holds -race builds, which don't match this one.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-release-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/secret-manager ./cmd/secret-manager
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.release == 'true' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    needs: [image, release]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package and push chart to oci://ghcr.io/${{ github.repository_owner }}/charts
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          helm package deploy/helm/k8s-secret-ui --version "$VERSION" --app-version "$VERSION" -d dist
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/k8s-secret-ui-${VERSION}.tgz" "oci://ghcr.io/${OWNER,,}/charts"
      - name: Tag the release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
