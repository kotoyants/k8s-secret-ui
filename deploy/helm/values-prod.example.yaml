# Example production values (namespace: admin). Ingress, namespaces, database and
# the app Secret are created outside the chart (Terraform).
#
#   helm upgrade --install secrets-ui deploy/helm/secrets-ui \
#     --namespace admin -f values-prod.yaml

image:
  tag: "0.3.6"

# Fixed Service name for the Terraform-managed Ingress: secrets-ui:80 (port name "http").
fullnameOverride: secrets-ui

config:
  baseURL: https://secrets.prod.nexora.promo
  allowedDomains: []        # e.g. [nexora.promo]
  adminEmails: []           # e.g. [you@nexora.promo]
  allowedNamespaces:
    - secrets

# Secret in namespace "admin" with keys:
#   DATABASE_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET
existingSecret: secrets-ui
