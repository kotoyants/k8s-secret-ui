{{- if .Values.rbac.create }}
{{- $root := . }}
{{- range .Values.config.allowedNamespaces }}
---
# Access to secrets in {{ . }} only. No cluster-wide permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "secrets-ui.fullname" $root }}
  namespace: {{ . }}
  labels:
    {{- include "secrets-ui.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "secrets-ui.fullname" $root }}
  namespace: {{ . }}
  labels:
    {{- include "secrets-ui.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "secrets-ui.fullname" $root }}
subjects:
  - kind: ServiceAccount
    name: {{ include "secrets-ui.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
